<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>習慣トラッカー</title>
  <meta name="description" content="毎日の習慣をチェックして、連続日数と今月の記録を確認できるアプリ">
  <meta property="og:title" content="習慣トラッカー">
  <meta property="og:description" content="毎日の習慣をチェックして、連続日数と今月の記録を確認できるアプリ">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ftsujikawa.github.io/habit-pwa/">
  <meta property="og:image" content="https://ftsujikawa.github.io/habit-pwa/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#2f7d4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="習慣">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>習慣トラッカー</h1>
    <p id="today" class="today"></p>
  </header>

  <main class="app-main">
    <form id="add-form" class="add-form" autocomplete="off" novalidate>
      <label for="habit-name" class="visually-hidden">新しい習慣の名前</label>
      <input id="habit-name" name="name" type="text" maxlength="30"
             placeholder="新しい習慣(例: 朝の散歩)" enterkeyhint="done">
      <button type="submit">追加</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <nav id="month-nav" class="month-nav" aria-label="表示する月">
      <button type="button" id="prev-month" class="month-nav-button" aria-label="前の月">‹</button>
      <p id="month-label" class="month-label" aria-live="polite"></p>
      <button type="button" id="next-month" class="month-nav-button" aria-label="次の月">›</button>
    </nav>

    <p id="empty" class="empty" hidden>まだ習慣がありません。上の欄から追加してください。</p>
    <ul id="habit-list" class="habit-list"></ul>

    <section class="data-section" aria-labelledby="data-heading">
      <h2 id="data-heading">データの管理</h2>
      <p class="data-note">データはこの端末の中にだけあります。機種変更や念のための控えに、ファイルへ書き出しておけます。</p>
      <div class="data-actions">
        <button type="button" id="export-button">書き出す</button>
        <button type="button" id="import-button">読み込む</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
    </section>
  </main>

  <noscript><p class="message">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
</body>
</html>
